<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entity — BharatWatch</title>
  <link rel="stylesheet" href="/static/app.css?v=3">
  <script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
</head>
<body>
<main id="page"><p>Loading…</p></main>
<script src="/static/app.js?v=3"></script>
<script>
renderHeader("");
const id = new URLSearchParams(location.search).get("id");
let cy = null, depth = 2, familyOnly = false;

function formatValue(key, val) {
  if (typeof val === "string" && (val.startsWith("http://") || val.startsWith("https://"))) {
    const disp = val.length > 36 ? val.substring(0, 33) + "..." : val;
    return `<a href="${val}" target="_blank" style="color:var(--accent);text-decoration:underline;word-break:break-all">${esc(disp)}</a>
            <a href="https://www.google.com/search?q=${encodeURIComponent(val)}" target="_blank" class="verify-search-btn" style="margin-left:6px;font-size:11px;opacity:0.6;text-decoration:none;color:var(--accent)" title="Verify on Google Search">🔍 Search</a>
            <span class="edit-link-btn" onclick="triggerEditLinkByUrl(this)" data-source="${esc(val)}" style="cursor:pointer;margin-left:8px;font-size:11px;opacity:0.6;user-select:none;color:var(--accent2)" title="Edit source link">✏️ Edit</span>`;
  }
  if (typeof val === "string" && val.includes("http")) {
    return val.replace(/(https?:\/\/[^\s\)]+)/g, (match) => {
      const disp = match.length > 36 ? match.substring(0, 33) + "..." : match;
      return `<a href="${match}" target="_blank" style="color:var(--accent);text-decoration:underline;word-break:break-all">${disp}</a>
              <a href="https://www.google.com/search?q=${encodeURIComponent(match)}" target="_blank" class="verify-search-btn" style="margin-left:6px;font-size:11px;opacity:0.6;text-decoration:none;color:var(--accent)" title="Verify on Google Search">🔍 Search</a>
              <span class="edit-link-btn" onclick="triggerEditLinkByUrl(this)" data-source="${esc(match)}" style="cursor:pointer;margin-left:8px;font-size:11px;opacity:0.6;user-select:none;color:var(--accent2)" title="Edit source link">✏️ Edit</span>`;
    });
  }
  if (key.toLowerCase().includes("value") || key.toLowerCase().includes("assets") || key.toLowerCase().includes("liabilities") || key.toLowerCase().includes("income") || key.toLowerCase().includes("amount")) {
    if (typeof val === "number") {
      return fmtCr(val);
    }
  }
  if (typeof val === "object" && val !== null) {
    return `<div style="padding-left:10px">${Object.entries(val).map(([k, v]) => `<strong>${k.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase())}:</strong> ${formatValue(k, v)}`).join("<br>")}</div>`;
  }
  return esc(val);
}

function renderEvidenceList(evidence) {
  return `<ul style="margin:8px 0;padding:0;font-size:13px;line-height:1.6">
    ${evidence.map(item => `
      <li style="margin-bottom:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;list-style:none;box-shadow:var(--shadow-sm)">
        ${Object.entries(item).map(([k, v]) => {
          const label = k.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
          return `<div style="margin-bottom:4px"><strong>${label}:</strong> ${formatValue(k, v)}</div>`;
        }).join("")}
      </li>
    `).join("")}
  </ul>`;
}

function searchLink(query) {
  const url = "https://www.google.com/search?q=" + encodeURIComponent(query);
  return `<a href="${url}" target="_blank" class="verify-search-btn" style="margin-left:6px;font-size:11px;opacity:0.6;text-decoration:none;user-select:none;color:var(--accent)" title="Verify on Google Search">🔍 Search</a>`;
}

function editBtn(table, id, currentSource) {
  return `<span class="edit-link-btn" onclick="triggerEditLink(this)" data-table="${table}" data-id="${id}" data-source="${esc(currentSource || '')}" style="cursor:pointer;margin-left:8px;font-size:11px;opacity:0.6;user-select:none;color:var(--accent2)" title="Edit source link">✏️ Edit</span>`;
}

function sourceBadge(url, isDeep, table, id, source, searchQuery) {
  const sBtn = searchQuery ? searchLink(searchQuery) : "";
  const eBtn = editBtn(table, id, source);
  
  if (!url) {
    return `<span style="font-size:11px;color:var(--muted)">No link</span> ${eBtn}`;
  }
  
  const label = isDeep ? "↗ Direct" : "⚠️ Homepage Only";
  const bg = isDeep ? "var(--success, #2ecc71)" : "var(--warn, #f39c12)";
  const title = isDeep ? "Direct Link Verified" : "Homepage Only (Please search and edit)";
  
  return `
    <span class="badge" style="background:${bg};color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;margin-right:4px;vertical-align:middle;display:inline-block" title="${title}">${label}</span>
    <a href="${esc(url)}" target="_blank" style="text-decoration:underline;color:inherit;vertical-align:middle">${esc(source || url)}</a>
    ${sBtn}
    ${eBtn}
  `;
}

async function triggerEditLink(el) {
  const table = el.dataset.table;
  const id = el.dataset.id;
  const currentSource = el.dataset.source;
  
  let hint = "";
  if (table === "declarations") {
    hint = "\nHint: Find this politician's asset declaration PDF on myneta.info or affidavit.eci.gov.in";
  } else if (table === "contracts") {
    hint = "\nHint: Find this procurement award record on eprocure.gov.in/cppp or bidplus.gem.gov.in or sppp.rajasthan.gov.in";
  } else if (table === "relationships" || table === "company_financials") {
    hint = "\nHint: Find this company/director registry details on mca.gov.in or zaubacorp.com or data.gov.in";
  } else if (table === "tenures") {
    hint = "\nHint: Find this member of parliament profile on sansad.in or state gazette portals";
  } else if (table === "fund_flows") {
    hint = "\nHint: Find this scheme disbursement record on pfms.nic.in or mplads.gov.in";
  }
  
  const newSource = prompt(`Edit Source URL/proof for this ${table} record:${hint}`, currentSource);
  if (newSource === null) return;
  try {
    const res = await api("/api/admin/edit-source", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Admin-Token": localStorage.getItem("bw-token") || "" },
      body: JSON.stringify({ table, id: parseInt(id), new_source: newSource })
    });
    if (res.ok) {
      alert("Source URL updated successfully! Refreshing page...");
      location.reload();
    } else {
      alert("Error: " + (res.error || "Failed to update"));
    }
  } catch (err) {
    alert("Error updating link: " + err.message);
  }
}

async function triggerEditLinkByUrl(el) {
  const currentSource = el.dataset.source;
  const newSource = prompt(`Edit this Source URL everywhere in the database:`, currentSource);
  if (newSource === null) return;
  try {
    const res = await api("/api/admin/edit-source-by-url", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ current_source: currentSource, new_source: newSource })
    });
    if (res.ok) {
      alert("Source URL updated successfully! Refreshing page...");
      location.reload();
    } else {
      alert("Error: " + (res.error || "Failed to update"));
    }
  } catch (err) {
    alert("Error updating link: " + err.message);
  }
}

const NODE_COLORS = { Politician: "#c0392b", Person: "#b9770e", Company: "#0b66c3",
                      GovtBody: "#0a8f6c", Trust: "#8e44ad", Unknown: "#7f8c8d" };
const EDGE_COLORS = { Contract_Awarded_To: "#c0392b", Fund_Transfer: "#b9770e",
                      Family_Link: "#8e44ad", Friend_Link: "#8e44ad", Associate: "#8e44ad", Close_Friend: "#8e44ad", Relative: "#8e44ad",
                      Director_Of: "#0b66c3", Shareholder_Of: "#0b66c3", Works_At: "#0b66c3", Employee_Of: "#0b66c3", Partner_Of: "#0b66c3",
                      Shared_Address: "#7f8c8d", Oversees: "#0a8f6c", Directs_Funds_To: "#0a8f6c" };

async function load() {
  let p;
  try { p = await api("/api/entity/" + id); }
  catch (e) { document.getElementById("page").innerHTML = "<p>Entity not found.</p>"; return; }
  const e = p.entity;
  const initials = e.name.split(/\s+/).map(w => w[0]).slice(0, 2).join("");
  document.title = e.name + " — BharatWatch";

  document.getElementById("page").innerHTML = `
    <div class="card profile-head">
      <div class="avatar">${esc(initials)}</div>
      <div>
        <h1>${esc(e.name)}</h1>
        <dl class="kv">
          <dt>Type</dt><dd>${esc(e.type)}${e.position ? " — " + esc(e.position) : ""}</dd>
          ${e.party ? `<dt>Party</dt><dd>${esc(e.party)}</dd>` : ""}
          ${e.constituency ? `<dt>Constituency</dt><dd>${esc(e.constituency)}, ${esc(e.state || "")}</dd>` : (e.state ? `<dt>State</dt><dd>${esc(e.state)}</dd>` : "")}
          ${e.pan ? `<dt>PAN</dt><dd>${esc(e.pan)}</dd>` : ""}
          ${e.din ? `<dt>DIN</dt><dd>${esc(e.din)}</dd>` : ""}
          ${e.cin ? `<dt>CIN</dt><dd>${esc(e.cin)}</dd>` : ""}
          ${p.declarations.length ? `<dt>Declared assets</dt><dd>${fmtCr(p.declarations.at(-1).assets)} (${p.declarations.at(-1).year})</dd>` : ""}
          ${e.criminal_cases ? `<dt>Criminal cases</dt><dd>${e.criminal_cases} declared</dd>` : ""}
        </dl>
        <div class="exports">
          <button onclick="window.print()">⤓ PDF report</button>
          <a href="/api/export/entity/${id}.csv">⤓ CSV linked entities</a>
          <a href="/api/export/entity/${id}.json">⤓ JSON graph data</a>
          <button onclick="exportPng()">⤓ Graph image</button>
        </div>
      </div>
      <div class="riskmeter">
        <div class="pct" style="color:${p.risk >= 70 ? "var(--danger)" : p.risk >= 40 ? "var(--warn)" : "var(--accent2)"}">${p.risk}%</div>
        <div class="label" style="color:var(--muted)">max risk score</div>
        ${p.flagged_value ? `<div class="badge risk-high" style="margin-top:6px">${fmtCr(p.flagged_value)} flagged</div>` : ""}
      </div>
    </div>

    <h2 class="section-title">Relationship graph</h2>
    <div class="graph-tools" style="display:flex;align-items:center;width:100%">
      <span>Depth:</span>
      ${[1, 2, 3].map(d => `<button class="ghost ${d === depth ? 'active' : ''}" data-d="${d}" onclick="setDepth(${d})">L${d}</button>`).join("")}
      <label style="margin-left:auto; display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; cursor:pointer; color:var(--text)">
        <input type="checkbox" id="familyOnlyToggle" onchange="toggleFamilyOnly(this.checked)" ${familyOnly ? 'checked' : ''} style="cursor:pointer; width:16px; height:16px; margin:0"/>
        Family Only
      </label>
      <span class="legend">
        <i style="background:#c0392b"></i>Politician <i style="background:#b9770e"></i>Person
        <i style="background:#0b66c3"></i>Company <i style="background:#0a8f6c"></i>Govt body
        <i style="background:#8e44ad"></i>Trust — ⚑ ring = flagged · click a node to drill down, click an edge for evidence
      </span>
    </div>
    <div id="graph-wrapper">
      <button class="graph-fullscreen-btn" id="graphFullscreenBtn" onclick="toggleGraphFullscreen()" title="Full screen graph view">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
      <button class="graph-close-fullscreen-btn" id="graphCloseFullscreenBtn" onclick="toggleGraphFullscreen()" style="display:none" title="Exit full screen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div id="graph"></div>
    </div>
    <div class="notice" id="edgeInfo" style="display:none"></div>

    ${p.flags.length ? `<h2 class="section-title">Flagged insights</h2>` : ""}
    ${p.flags.map(f => `
      <div class="card flagbox">
        <div class="head"><h3>${esc(f.title)}</h3>${riskBadge(f.risk_score)}</div>
        <div class="pattern">PATTERN: ${esc(f.pattern)} · ${fmtCr(f.value_involved || 0)} involved</div>
        <p class="expl">${esc(f.explanation)}</p>
        
        <div style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">
          <details class="evidence-details"><summary style="cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;">Evidence records (${f.evidence.length})</summary>
            <div style="margin-top:8px">${renderEvidenceList(f.evidence)}</div></details>
            
          ${f.rti_suggestion ? `
          <div class="rti-suggestion-box" style="padding:12px 16px; background:var(--panel2); border-left:4px solid var(--accent); border-radius:8px; box-shadow:var(--shadow-sm);">
            <details>
              <summary style="cursor:pointer; font-weight:700; color:var(--accent); font-size:13px; display:inline-flex; align-items:center; gap:6px; user-select:none;">
                <span>📋</span> Suggest RTI to Verify/Debunk
              </summary>
              <div style="margin-top:10px; font-size:13px; color:var(--text);">
                <div style="margin-bottom:8px;">
                  <strong style="color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:0.5px;">Target Public Authority</strong> <br>

                </div>
                <div style="margin-bottom:6px;">
                  <strong style="color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:0.5px;">Draft RTI Queries</strong>

              </div>
            </details>
          </div>
          ` : ""}
        </div>
      </div>`).join("")}

    <div class="tabs" id="tabs">
      <button data-t="timeline" class="active">Timeline</button>
      ${e.type === 'Politician' ? `<button data-t="tenures">Tenures (${p.tenures.length})</button>` : ''}
      <button data-t="relationships">Relationships (${p.relationships.length})</button>
      ${e.type === 'Politician' ? `<button data-t="family">Family & Associates (${p.first_degree_connections.length})</button>` : ''}
      <button data-t="companies">Companies (${p.companies.length})</button>
      <button data-t="contracts">Contracts (${p.contracts.length})</button>
      <button data-t="flows">Fund flows (${p.fund_flows.length})</button>
      ${e.type === 'Politician' ? `<button data-t="assets">Assets (${p.declarations.length})</button>` : ''}
      ${e.type === 'Company' ? `<button data-t="financials">Financials (${p.financials.length})</button>` : ''}
      ${e.type === 'Politician' ? `<button data-t="scams">Allegations & Scams ⚑</button>` : ''}
    </div>

    <div class="tabpane active" id="pane-timeline">
      <div class="timeline">${p.timeline.map(t => `
        <div class="ev"><div class="d">${esc(t.date)} · ${esc(t.kind)}${t.source ? ` · <span style="font-size:11px;color:var(--muted)">Source: ${t.source_url ? `<a href="${esc(t.source_url)}" target="_blank" style="text-decoration:underline;color:inherit">${esc(t.source)}</a>` : esc(t.source)}</span>` : ""}</div><div>${esc(t.text)}</div></div>`).join("") || "No events."}
      </div>
    </div>
    
    ${e.type === 'Politician' ? `
    <div class="tabpane" id="pane-scams">
      <div style="margin-top:10px">
        <div class="card" style="margin-bottom:16px;background:var(--panel2);border-left:4px solid var(--danger)">
          <h3 style="margin:0 0 8px 0">Automated Background Investigation (Scams & Probes)</h3>
          <p style="margin:0 0 12px 0;font-size:14px;color:var(--muted)">

          </p>
          <div style="margin-bottom:14px">
            <button onclick="triggerScamScan()" class="ghost" style="background:var(--accent);color:#fff;border-color:var(--accent);display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer">

              <ul id="scamRefs" style="margin:6px 0 0 0;padding-left:20px;line-height:1.5"></ul>
            </div>
          </div>

        <div class="card">

          <dl class="kv" style="font-size:14px;border-top:1px solid var(--line);padding-top:12px">
            <dt>Declared Criminal Charges</dt>
            <dd style="font-weight:700;color:${e.criminal_cases ? 'var(--danger)' : 'inherit'}">
              ${e.criminal_cases} case(s) declared in ECI affidavits
            </dd>
          </dl>
        </div>
      </div>
    </div>` : ''}
    ${e.type === 'Politician' ? `
    <div class="tabpane" id="pane-tenures">
      <table class="data"><tr><th>Office</th><th>Start Date</th><th>End Date</th><th>Source</th></tr>
      ${p.tenures.map(t => `<tr><td>${esc(t.office)}</td><td>${esc(t.start_date)}</td>
        <td>${esc(t.end_date || "Present")}</td><td>
          ${sourceBadge(t.source_url, t.is_deep_link, 'tenures', t.id, t.source, e.name + ' ' + t.office + ' tenure')}

        <td><a href="/entity?id=${r.from_id}">${esc(r.from_name)}</a></td>

        <td>${esc(r.evidence || "")}</td>

          ${sourceBadge(r.source_url, r.is_deep_link, 'relationships', r.id, r.source, r.from_name + ' ' + r.to_name + ' ' + r.type)}

            </div>
            <dl class="kv" style="margin-bottom:12px;font-size:13px">

                  <tr>

    <div class="tabpane" id="pane-companies">
      <table class="data"><tr><th>Company</th><th>CIN</th><th>Incorporated</th><th>Linked via</th></tr>
      ${p.companies.map(c => `<tr><td><a href="/entity?id=${c.id}">${esc(c.name)}</a></td>
        <td>${esc(c.cin || "")}</td><td>${esc(c.incorporation_date || "")}</td><td>${esc(c.via)}</td></tr>`).join("") || "<tr><td colspan=4>None</td></tr>"}
      </table>
    </div>
    <div class="tabpane" id="pane-contracts">
      <table class="data"><tr><th>Tender</th><th>Title</th><th>Buyer</th><th>Supplier</th><th>Value</th><th>Date</th><th>Source</th></tr>
      ${p.contracts.map(k => `<tr><td>${esc(k.tender_id)}</td><td>${esc(k.title)}</td>
        <td>${esc(k.buyer_name)}</td><td>${esc(k.supplier_name)}</td><td>${fmtCr(k.value)}</td>
        <td>${esc(k.award_date)}</td><td>
          ${sourceBadge(k.source_url, k.is_deep_link, 'contracts', k.id, k.source, k.supplier_name + ' ' + k.title + ' ' + k.tender_id)}
        </td></tr>`).join("") || "<tr><td colspan=7>None</td></tr>"}
      </table>
    </div>
    <div class="tabpane" id="pane-flows">
      <table class="data"><tr><th>Scheme</th><th>From</th><th>To</th><th>Amount</th><th>Date</th><th>Purpose</th><th>Source</th></tr>
      ${p.fund_flows.map(f => `<tr><td>${esc(f.scheme)}</td><td>${esc(f.from_name)}</td>
        <td>${esc(f.to_name)}</td><td>${fmtCr(f.amount)}</td><td>${esc(f.date)}</td><td>${esc(f.purpose)}</td>
        <td>
          ${sourceBadge(f.source_url, f.is_deep_link, 'fund_flows', f.id, f.source, f.from_name + ' ' + f.to_name + ' ' + f.scheme)}
        </td></tr>`).join("") || "<tr><td colspan=7>None</td></tr>"}
      </table>
    </div>
    ${e.type === 'Politician' ? `
    <div class="tabpane" id="pane-assets">
      <table class="data"><tr><th>Year</th><th>Assets</th><th>Liabilities</th><th>Annual income</th><th>Source</th></tr>
      ${p.declarations.map(d => `<tr><td>${d.year}</td><td>${fmtCr(d.assets)}</td>
        <td>${fmtCr(d.liabilities)}</td><td>${fmtCr(d.income)}</td><td>
          ${sourceBadge(d.source_url, d.is_deep_link, 'declarations', d.id, d.source, e.name + ' assets ' + d.year)}
        </td></tr>`).join("") || "<tr><td colspan=5>None</td></tr>"}
      </table>
    </div>` : ''}
    ${e.type === 'Company' ? `
    <div class="tabpane" id="pane-financials">
      <table class="data"><tr><th>Year</th><th>Assets</th><th>Liabilities</th><th>Revenue</th><th>Net Profit</th><th>Source</th></tr>
      ${p.financials.map(fn => `<tr><td>${fn.year}</td><td>${fmtCr(fn.assets)}</td>
        <td>${fmtCr(fn.liabilities)}</td><td>${fmtCr(fn.revenue)}</td><td>${fmtCr(fn.net_profit)}</td><td>
          ${sourceBadge(fn.source_url, fn.is_deep_link, 'company_financials', fn.id, fn.source, e.name + ' financials ' + fn.year)}
        </td></tr>`).join("") || "<tr><td colspan=6>None</td></tr>"}
      </table>
    </div>` : ''}

    ${p.source_links && p.source_links.length ? `
    <h2 class="section-title" style="display:flex;align-items:center;gap:8px;margin-top:40px">
      <span style="color:var(--accent)">🗄️</span> Verification & Source Database
    </h2>
    <div class="card" style="margin-top:14px">
      <p style="margin:0 0 16px 0;font-size:14px;color:var(--muted)">
        The findings compiled in this risk score profile are backed by localized raw data files ingested directly from primary Indian public portals (ECI, MCA, SPPP). They are located in your workspace under <code>${esc(p.source_dir)}/</code>.
      </p>
      <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));gap:14px">
        ${p.source_links.map(sl => `
          <a href="${esc(sl.url)}" target="_blank" style="display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;color:inherit;text-decoration:none;transition:transform 0.15s, box-shadow 0.15s;display:flex" onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='var(--shadow)'" onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='none'">
            <span style="font-size:24px;color:var(--accent)">🌐</span>
            <div style="display:flex;flex-direction:column">
              <span style="font-weight:700;font-size:14px;color:var(--text)">${esc(sl.domain)}</span>
              <span style="font-size:11px;color:var(--muted)">Source: ${esc(sl.source)}</span>
            </div>
          </a>`).join("")}
      </div>
    </div>` : ""}
    `;

  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
    document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("active", x === b));
    document.querySelectorAll(".tabpane").forEach(x =>
      x.classList.toggle("active", x.id === "pane-" + b.dataset.t));
  });
  drawGraph();
}

async function drawGraph() {
  const box = document.getElementById("graph");
  if (typeof cytoscape === "undefined") {
    box.innerHTML = "<p style='padding:20px'>Graph library could not load (offline?). Use the Linked Data tabs below.</p>";
    return;
  }
  const g = await api(`/api/graph/${id}?depth=${depth}`);
  
  let edges = g.edges.map(e => ({ data: { id: e.id, source: "n" + e.source, target: "n" + e.target,
                                         type: e.type, evidence: e.evidence || "", src: e.src || "",
                                         value: e.value || 0 } }));
                                         
  let nodes = g.nodes.map(n => ({ data: { id: "n" + n.id, eid: n.id, label: n.label, type: n.type || "Unknown",
                                         flagged: n.flagged ? 1 : 0, center: n.center ? 1 : 0 } }));
                                         
  if (familyOnly) {
    edges = edges.filter(e => e.data.type === "Family_Link");
    const connectedNodeIds = new Set();
    connectedNodeIds.add("n" + id);
    edges.forEach(e => {
      connectedNodeIds.add(e.data.source);
      connectedNodeIds.add(e.data.target);
    });
    nodes = nodes.filter(n => connectedNodeIds.has(n.data.id));
  }
  
  const elements = [ ...nodes, ...edges ];
  if (cy) cy.destroy();
  cy = cytoscape({
    container: box, elements,
    style: [
      { selector: "node", style: {
          label: "data(label)", 
          "font-size": 12, 
          color: getComputedStyle(document.body).color,
          "text-wrap": "wrap", 
          "text-max-width": 130, 
          "text-valign": "bottom", 
          "text-margin-y": 8,
          width: 32, 
          height: 32,
          shape: (n) => n.data("type") === "Politician" ? "ellipse" : n.data("type") === "Company" ? "rectangle" : "round-rectangle",
          "background-color": (n) => NODE_COLORS[n.data("type")] || NODE_COLORS.Unknown,
          "border-width": 1,
          "border-color": "#ffffff",
          "text-background-color": getComputedStyle(document.body).backgroundColor || "#f6f7f9",
          "text-background-opacity": 0.8,
          "text-background-padding": 3,
          "text-background-shape": "roundrectangle"
      } },
      { selector: "node[center = 1]", style: { 
          width: 50, 
          height: 50, 
          "border-width": 4, 
          "border-color": "#f1c40f",
          "font-weight": "bold"
      } },
      { selector: "node[flagged = 1]", style: { 
          "border-width": 3, 
          "border-color": "#e74c3c", 
          "border-style": "solid" 
      } },
      { selector: "edge", style: {
          width: (e) => Math.min(2.0 + (e.data("value") || 0) / 5e7, 8),
          "curve-style": "bezier", 
          "target-arrow-shape": "triangle",
          "line-color": (e) => EDGE_COLORS[e.data("type")] || "#95a5a6",
          "target-arrow-color": (e) => EDGE_COLORS[e.data("type")] || "#95a5a6",
          label: (e) => {
            const type = e.data("type");
            const evidence = e.data("evidence");
            if (type === "Family_Link" || type === "Friend_Link") {
              if (evidence) {
                const lower = evidence.toLowerCase();
                if (lower.includes("spouse") || lower.includes("wife")) return `${type} (Spouse)`;
                if (lower.includes("son")) return `${type} (Son)`;
                if (lower.includes("daughter")) return `${type} (Daughter)`;
                if (lower.includes("father")) return `${type} (Father)`;
                if (lower.includes("mother")) return `${type} (Mother)`;
                if (lower.includes("brother")) return `${type} (Brother)`;
                if (lower.includes("sister")) return `${type} (Sister)`;
                if (lower.includes("friend")) return `${type} (Friend)`;
                if (evidence.length < 30) return `${type} (${evidence})`;
              }
            }
            return type;
          }, 
          "font-size": 9, 
          "text-rotation": "autorotate",
          color: getComputedStyle(document.body).color, 
          "text-background-opacity": 0.95,
          "text-background-color": getComputedStyle(document.body).backgroundColor || "#f6f7f9",
          "text-background-padding": 2,
          "text-background-shape": "roundrectangle"
      } },
    ],
    layout: { 
      name: "cose", 
      animate: true, 
      animationDuration: 800,
      refresh: 20,
      fit: true,
      padding: 50, 
      nodeRepulsion: 8000000,
      idealEdgeLength: 160, 
      nodeOverlap: 40,
      gravity: 80,
      numIter: 1000,
      initialTemp: 200,
      coolingFactor: 0.95
    },
  });
  cy.on("tap", "node", (ev) => {
    const eid = ev.target.data("eid");
    if (eid && eid != id) location.href = "/entity?id=" + eid;
  });
  cy.on("tap", "edge", (ev) => {
    const d = ev.target.data();
    const info = document.getElementById("edgeInfo");
    info.style.display = "block";
    info.innerHTML = `<strong>${esc(d.type)}</strong>${d.value ? " · " + fmtCr(d.value) : ""}<br>
      ${esc(d.evidence)}<br><span style="color:var(--muted)">Source: ${esc(d.src)}</span>`;
  });
}

function setDepth(d) {
  depth = d;
  document.querySelectorAll(".graph-tools button[data-d]").forEach(btn => {
    const dVal = parseInt(btn.dataset.d);
    btn.classList.toggle("active", dVal === d);
  });
  drawGraph();
}

function toggleFamilyOnly(checked) {
  familyOnly = checked;
  drawGraph();
}
function toggleGraphFullscreen() {
  const wrap = document.getElementById("graph-wrapper");
  const isFS = wrap.classList.toggle("fullscreen");
  document.getElementById("graphFullscreenBtn").style.display = isFS ? "none" : "flex";
  document.getElementById("graphCloseFullscreenBtn").style.display = isFS ? "flex" : "none";
  document.body.style.overflow = isFS ? "hidden" : "";
  if (cy) {
    setTimeout(() => { cy.resize(); cy.fit(); }, 150);
  }
}
function exportPng() {
  if (!cy) return;
  const a = document.createElement("a");
  a.href = cy.png({ full: true, scale: 2, bg: getComputedStyle(document.body).backgroundColor });
  a.download = "bharatwatch_graph.png";
  a.click();
}
function copyRti(btn) {
  const box = btn.closest(".rti-suggestion-box");
  const auth = box.querySelector(".rti-authority").innerText;
  const queries = box.querySelector(".rti-text").innerText;
  const fullText = `Target Public Authority:\n${auth}\n\nDraft RTI Application Queries:\n${queries}`;
  navigator.clipboard.writeText(fullText).then(() => {
    const originalText = btn.innerText;
    btn.innerText = "Copied!";
    btn.style.background = "var(--success)";
    btn.style.color = "#fff";
    setTimeout(() => {
      btn.innerText = originalText;
      btn.style.background = "";
      btn.style.color = "";
    }, 2000);
  }).catch(err => {
    alert("Failed to copy: " + err);
  });
}
async function triggerScamScan() {
  const box = document.getElementById("scamResult");
  const txt = document.getElementById("scamText");
  const refs = document.getElementById("scamRefs");
  
  box.style.display = "block";
  txt.innerHTML = "<em>Scraping public news databases and verifying allegations. Please wait, this takes a few seconds...</em>";
  refs.innerHTML = "";
  
  try {
    const res = await api(`/api/entity/scam-scan?id=${id}`);
    if (res.ok) {
      txt.innerHTML = res.summary;
      if (res.references && res.references.length) {
        refs.innerHTML = res.references.map(r => `
          <li><a href="${esc(r.url)}" target="_blank" style="color:var(--accent);text-decoration:underline">${esc(r.title)}</a> (${esc(r.source)})</li>
        `).join("");
      } else {
        refs.innerHTML = "<li>No direct articles indexed.</li>";
      }
    } else {
      txt.innerHTML = `<span style="color:var(--danger)">Error: ${esc(res.error || "Failed to scan.")}</span>`;
    }
  } catch (err) {
    txt.innerHTML = `<span style="color:var(--danger)">Scan failed: ${esc(err.message)}</span>`;
  }
}

load();
</script>
